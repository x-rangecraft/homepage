<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xrange — Intelligence, Embodied</title>
  <meta name="description" content="Xrange builds embodied vehicles — intelligent machines that walk, see, and interact in the physical world. Meet Dragon Rider.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#050505;
      --bg-elevated:#0d0d0d;
      --bg-subtle:#161616;
      --bg-card:#0a0a0a;
      --text:#e8e8e8;
      --text-muted:#888;
      --text-dim:#555;
      --accent:#c8ff00;
      --accent-dim:#6b8700;
      --accent-warm:#ff6b2b;
      --accent-glow:rgba(200,255,0,.08);
      --font:'Space Grotesk','Noto Sans SC',system-ui,-apple-system,sans-serif;
    }
    html{scroll-behavior:smooth;font-size:16px}
    body{
      font-family:var(--font);
      background:var(--bg);
      color:var(--text);
      line-height:1.6;
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }
    ::selection{background:var(--accent);color:var(--bg)}

    /* ── Nav ── */
    nav{
      position:fixed;top:0;left:0;right:0;z-index:100;
      padding:1.25rem 3rem;
      display:flex;align-items:center;justify-content:space-between;
      background:rgba(5,5,5,.85);
      backdrop-filter:blur(24px);
      border-bottom:1px solid transparent;
      transition:border-color .3s;
    }
    nav.scrolled{border-bottom-color:rgba(255,255,255,.04)}
    .nav-logo{display:flex;align-items:center;line-height:0}
    .nav-logo img{height:38px;width:auto;display:block;filter:invert(1);opacity:.92;object-fit:contain}
    .nav-right{display:flex;align-items:center;gap:2rem}
    .nav-links{display:flex;gap:2.5rem;list-style:none}
    .nav-links a{
      color:var(--text-dim);text-decoration:none;font-size:.8rem;
      font-weight:500;letter-spacing:.08em;text-transform:uppercase;
      transition:color .2s;
    }
    .nav-links a:hover{color:var(--text)}
    .lang-switch{
      display:flex;align-items:center;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
      border-radius:4px;overflow:hidden;
      font-size:.7rem;font-weight:600;letter-spacing:.06em;
    }
    .lang-btn{
      padding:.35rem .65rem;
      background:none;border:none;
      color:var(--text-dim);cursor:pointer;
      transition:all .2s;text-transform:uppercase;
    }
    .lang-btn.active{
      background:var(--accent);
      color:var(--bg);
    }
    .lang-btn:hover:not(.active){color:var(--text)}
    .nav-toggle{display:none;background:none;border:none;color:var(--text);cursor:pointer}

    /* ── Hero ── */
    .hero{
      min-height:100vh;display:flex;align-items:center;
      position:relative;padding:0 3rem;
      overflow:hidden;
    }
    #hero-canvas{
      position:absolute;inset:0;z-index:0;
      width:100%;height:100%;
      pointer-events:none;
    }
    .hero-noise{
      position:absolute;inset:0;
      background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");
      pointer-events:none;z-index:1;
    }
    .hero-content{
      position:relative;z-index:2;
      max-width:960px;
      padding:8rem 0;
    }
    .hero-eyebrow{
      display:inline-flex;align-items:center;gap:.6rem;
      font-size:.7rem;font-weight:600;letter-spacing:.15em;
      text-transform:uppercase;color:var(--accent);
      margin-bottom:2.5rem;
    }
    .hero-eyebrow::before{
      content:'';width:32px;height:1px;
      background:var(--accent);
    }
    .hero h1{
      font-size:clamp(3rem,7vw,6.5rem);
      font-weight:700;line-height:.95;
      letter-spacing:-.04em;
      margin-bottom:2rem;
    }
    .hero h1 .glow{
      color:var(--accent);
      text-shadow:0 0 80px rgba(200,255,0,.3);
    }
    .hero-sub{
      font-size:clamp(1rem,2vw,1.2rem);
      color:var(--text-muted);max-width:560px;
      line-height:1.8;font-weight:300;
      margin-bottom:3rem;
    }
    .hero-cta{
      display:inline-flex;align-items:center;gap:.75rem;
      padding:1rem 2.25rem;
      background:var(--accent);color:var(--bg);
      font-weight:600;font-size:.85rem;
      text-decoration:none;letter-spacing:.06em;
      text-transform:uppercase;
      transition:all .25s;
      clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
    }
    .hero-cta:hover{
      background:#dfff4a;
      box-shadow:0 0 60px rgba(200,255,0,.2);
    }
    .hero-cta svg{width:14px;height:14px;transition:transform .2s}
    .hero-cta:hover svg{transform:translateX(4px)}
    .hero-scroll{
      position:absolute;bottom:3rem;left:3rem;z-index:2;
      display:flex;flex-direction:column;align-items:center;gap:.5rem;
      font-size:.65rem;font-weight:500;letter-spacing:.15em;
      text-transform:uppercase;color:var(--text-dim);
    }
    .hero-scroll::after{
      content:'';width:1px;height:48px;
      background:linear-gradient(to bottom,var(--text-dim),transparent);
      animation:scroll-pulse 2s ease-in-out infinite;
    }
    @keyframes scroll-pulse{
      0%,100%{opacity:.3;transform:scaleY(.6)}
      50%{opacity:1;transform:scaleY(1)}
    }

    /* ── Section ── */
    section{padding:8rem 3rem}
    .section-inner{max-width:1100px;margin:0 auto}
    .section-label{
      font-size:.65rem;font-weight:600;letter-spacing:.2em;
      text-transform:uppercase;color:var(--accent);margin-bottom:1rem;
      display:flex;align-items:center;gap:.75rem;
    }
    .section-label::before{content:'';width:20px;height:1px;background:var(--accent)}
    .section-title{
      font-size:clamp(2rem,4vw,3.25rem);
      font-weight:700;letter-spacing:-.03em;
      line-height:1.1;margin-bottom:1.25rem;
    }
    .section-desc{
      font-size:1rem;color:var(--text-muted);
      max-width:560px;line-height:1.8;font-weight:300;
    }

    /* ── Product ── */
    .product{
      position:relative;overflow:hidden;
      border-bottom:1px solid rgba(255,255,255,.04);
    }
    .product .section-inner{
      display:grid;grid-template-columns:1fr 1fr;gap:5rem;
      align-items:center;
    }
    .product-visual{
      position:relative;aspect-ratio:4/3;
      display:flex;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at center,rgba(200,255,0,.04) 0%,transparent 70%);
      border:1px solid rgba(255,255,255,.04);
      border-radius:2px;
    }
    .product-visual-label{
      font-size:.7rem;font-weight:600;letter-spacing:.15em;
      text-transform:uppercase;color:var(--text-dim);
    }
    .product-text .section-desc{margin-bottom:2rem}
    .product-features{
      display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;
      margin-top:2rem;
    }
    .product-feature{
      padding:1.25rem;
      border:1px solid rgba(255,255,255,.04);
      transition:border-color .3s;
    }
    .product-feature:hover{border-color:rgba(200,255,0,.15)}
    .product-feature h4{
      font-size:.8rem;font-weight:600;letter-spacing:.04em;
      margin-bottom:.4rem;
    }
    .product-feature p{
      font-size:.75rem;color:var(--text-dim);line-height:1.6;
    }

    /* ── Vision ── */
    .vision{position:relative;overflow:hidden}
    .vision .section-inner{
      display:grid;grid-template-columns:1fr 1fr;gap:6rem;
      align-items:center;
    }
    .vision-visual{
      position:relative;aspect-ratio:1;
      display:flex;align-items:center;justify-content:center;
    }
    .dna-helix{width:100%;height:100%;position:relative}
    .dna-strand{
      position:absolute;
      width:3px;border-radius:2px;
      background:linear-gradient(to bottom,transparent,var(--accent),var(--accent-warm),transparent);
      opacity:.15;animation:strand-drift 8s ease-in-out infinite;
    }
    .dna-strand:nth-child(1){left:15%;height:80%;top:10%;animation-delay:0s}
    .dna-strand:nth-child(2){left:30%;height:60%;top:20%;animation-delay:1s;opacity:.1}
    .dna-strand:nth-child(3){left:50%;height:90%;top:5%;animation-delay:2s;opacity:.2}
    .dna-strand:nth-child(4){left:70%;height:70%;top:15%;animation-delay:3s;opacity:.12}
    .dna-strand:nth-child(5){left:85%;height:50%;top:25%;animation-delay:4s;opacity:.08}
    @keyframes strand-drift{
      0%,100%{transform:translateY(0) scaleY(1)}
      50%{transform:translateY(-10px) scaleY(1.05)}
    }
    .dna-pulse{
      position:absolute;width:200px;height:200px;
      top:50%;left:50%;transform:translate(-50%,-50%);
      border-radius:50%;
      background:radial-gradient(circle,rgba(200,255,0,.1),transparent 70%);
      animation:core-pulse 4s ease-in-out infinite;
    }
    @keyframes core-pulse{
      0%,100%{transform:translate(-50%,-50%) scale(.8);opacity:.5}
      50%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
    }
    .dna-dots{position:absolute;inset:0}
    .dna-dot{
      position:absolute;width:4px;height:4px;border-radius:50%;
      background:var(--accent);opacity:.3;animation:dot-float 6s ease-in-out infinite;
    }
    .dna-dot:nth-child(1){top:20%;left:25%;animation-delay:0s}
    .dna-dot:nth-child(2){top:35%;left:65%;animation-delay:1.5s}
    .dna-dot:nth-child(3){top:55%;left:40%;animation-delay:3s}
    .dna-dot:nth-child(4){top:70%;left:75%;animation-delay:4.5s}
    .dna-dot:nth-child(5){top:85%;left:30%;animation-delay:2s}
    .dna-dot:nth-child(6){top:15%;left:80%;animation-delay:3.5s}
    @keyframes dot-float{
      0%,100%{transform:translate(0,0);opacity:.2}
      50%{transform:translate(5px,-8px);opacity:.6}
    }
    .vision-beyond{
      margin-top:2.5rem;padding-top:1.5rem;
      border-top:1px solid rgba(255,255,255,.06);
    }
    .vision-beyond p{
      font-size:.8rem;color:var(--text-dim);line-height:1.7;
      font-style:italic;
    }

    /* ── Capabilities ── */
    .capabilities{background:var(--bg)}
    .cap-header{margin-bottom:4rem}
    .cap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.04)}
    .cap-card{
      padding:2.5rem;background:var(--bg);
      transition:background .3s;position:relative;
    }
    .cap-card:hover{background:var(--bg-elevated)}
    .cap-card::before{
      content:'';position:absolute;top:0;left:2.5rem;
      width:24px;height:2px;background:var(--accent);
      opacity:0;transition:opacity .3s;
    }
    .cap-card:hover::before{opacity:1}
    .cap-num{
      font-size:.65rem;font-weight:600;letter-spacing:.1em;
      color:var(--text-dim);margin-bottom:1.5rem;font-variant-numeric:tabular-nums;
    }
    .cap-card h3{font-size:1.05rem;font-weight:600;margin-bottom:.75rem;letter-spacing:-.01em}
    .cap-card p{font-size:.85rem;color:var(--text-muted);line-height:1.7}

    /* ── Philosophy ── */
    .philosophy{
      background:var(--bg);
      border-top:1px solid rgba(255,255,255,.04);
    }
    .phil-header{margin-bottom:4rem}
    .phil-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
    .phil-item{
      padding:3rem;border:1px solid rgba(255,255,255,.04);
      margin:-1px 0 0 -1px;transition:background .3s;
    }
    .phil-item:hover{background:rgba(200,255,0,.02)}
    .phil-item .quote{
      font-size:1.6rem;font-weight:700;
      line-height:1.2;letter-spacing:-.02em;margin-bottom:1rem;
    }
    .phil-item .quote .hi{color:var(--accent)}
    .phil-item p{font-size:.85rem;color:var(--text-muted);line-height:1.7}

    /* ── Stats ── */
    .stats{
      border-top:1px solid rgba(255,255,255,.04);
      border-bottom:1px solid rgba(255,255,255,.04);
      padding:4rem 3rem;
    }
    .stats-inner{
      max-width:1100px;margin:0 auto;
      display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;text-align:center;
    }
    .stat-num{
      font-size:clamp(2rem,4vw,3rem);font-weight:700;color:var(--accent);
      letter-spacing:-.03em;line-height:1;margin-bottom:.5rem;
    }
    .stat-label{
      font-size:.75rem;color:var(--text-dim);
      letter-spacing:.06em;text-transform:uppercase;font-weight:500;
    }

    /* ── Contact ── */
    .contact{text-align:center}
    .contact .section-inner{max-width:800px}
    .contact .section-label{justify-content:center}
    .contact .section-title{margin-bottom:1.5rem}
    .contact .section-desc{margin:0 auto 3rem;max-width:520px}
    .contact-grid{
      display:grid;grid-template-columns:1fr 1fr;gap:2rem;
      max-width:600px;margin:0 auto;
    }
    .contact-card{
      padding:2rem;
      border:1px solid rgba(255,255,255,.06);
      transition:all .25s;text-align:center;
      text-decoration:none;color:var(--text);
      display:flex;flex-direction:column;align-items:center;gap:.75rem;
    }
    .contact-card:hover{
      border-color:rgba(200,255,0,.2);
      background:rgba(200,255,0,.02);
    }
    .contact-card-icon{
      width:40px;height:40px;display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(255,255,255,.08);border-radius:50%;
    }
    .contact-card-icon svg{width:18px;height:18px;color:var(--accent)}
    .contact-card h4{font-size:.85rem;font-weight:600;letter-spacing:.02em}
    .contact-card p{font-size:.75rem;color:var(--text-dim);line-height:1.5}

    /* ── Footer ── */
    footer{
      padding:3rem;border-top:1px solid rgba(255,255,255,.04);
      display:flex;justify-content:space-between;align-items:center;
    }
    footer p{font-size:.7rem;color:var(--text-dim);letter-spacing:.04em}
    footer .footer-links{display:flex;gap:1.5rem}
    footer .footer-links a{
      color:var(--text-dim);text-decoration:none;font-size:.7rem;
      letter-spacing:.04em;transition:color .2s;
    }
    footer .footer-links a:hover{color:var(--accent)}

    /* ── Reveal ── */
    .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
    .reveal.visible{opacity:1;transform:translateY(0)}

    /* ── Responsive ── */
    @media(max-width:768px){
      nav{padding:1rem 1.25rem}
      .nav-logo img{height:30px}
      .nav-links{
        display:none;position:absolute;top:100%;left:0;right:0;
        flex-direction:column;gap:0;
        background:rgba(5,5,5,.96);backdrop-filter:blur(24px);
        border-bottom:1px solid rgba(255,255,255,.04);padding:.75rem 0;
      }
      .nav-links.open{display:flex}
      .nav-links a{padding:.75rem 1.5rem;font-size:.75rem}
      .nav-toggle{display:block}
      .hero{padding:0 1.25rem;min-height:100svh;align-items:flex-end}
      .hero-content{padding:0 0 4rem}
      .hero h1{font-size:clamp(2.2rem,10vw,3.5rem);margin-bottom:1.25rem}
      .hero-eyebrow{margin-bottom:1.5rem;font-size:.6rem}
      .hero-sub{font-size:.9rem;line-height:1.7;margin-bottom:2rem;max-width:100%}
      .hero-cta{padding:.85rem 1.75rem;font-size:.8rem}
      .hero-scroll{display:none}
      section{padding:4rem 1.25rem}
      .section-title{font-size:clamp(1.6rem,6vw,2.2rem)}
      .section-desc{font-size:.9rem;line-height:1.7}
      .section-label{font-size:.6rem}
      .product .section-inner{grid-template-columns:1fr;gap:2rem}
      .product-visual{aspect-ratio:16/9;min-height:140px}
      .product-features{grid-template-columns:1fr;gap:1rem;margin-top:1.5rem}
      .product-feature{padding:1rem}
      .product-feature h4{font-size:.75rem}
      .product-feature p{font-size:.7rem}
      .vision .section-inner{grid-template-columns:1fr;gap:2.5rem}
      .vision-visual{max-width:220px;margin:0 auto}
      .vision-beyond p{font-size:.75rem}
      .cap-grid{grid-template-columns:1fr}
      .cap-card{padding:1.75rem}
      .cap-card h3{font-size:.95rem}
      .cap-card p{font-size:.8rem}
      .phil-grid{grid-template-columns:1fr}
      .phil-item{padding:2rem 1.5rem}
      .phil-item .quote{font-size:1.3rem}
      .phil-item p{font-size:.8rem}
      .stats-inner{grid-template-columns:repeat(2,1fr);gap:1.5rem}
      .stats{padding:2.5rem 1.25rem}
      .stat-num{font-size:clamp(1.6rem,8vw,2.2rem)}
      .stat-label{font-size:.65rem}
      .contact-grid{grid-template-columns:1fr;gap:1rem}
      .contact-card{padding:1.5rem}
      footer{flex-direction:column;gap:1rem;text-align:center;padding:1.5rem 1.25rem}
    }

    @media(max-width:380px){
      .hero h1{font-size:2rem}
      .hero-sub{font-size:.85rem}
      .section-title{font-size:1.5rem}
      .phil-item .quote{font-size:1.15rem}
      .product-features{gap:.75rem}
    }
  </style>
</head>
<body>

<!-- Nav -->
<nav id="nav">
  <a href="#" class="nav-logo"><img src="logo.png" alt="Xrange"></a>
  <div class="nav-right">
    <ul class="nav-links" id="navLinks">
      <li><a href="#product" data-i18n="nav.product"></a></li>
      <li><a href="#vision" data-i18n="nav.vision"></a></li>
      <li><a href="#capabilities" data-i18n="nav.capabilities"></a></li>
      <li><a href="#philosophy" data-i18n="nav.philosophy"></a></li>
      <li><a href="#contact" data-i18n="nav.contact"></a></li>
    </ul>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="zh">中</button>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/>
      </svg>
    </button>
  </div>
</nav>

<!-- Hero -->
<section class="hero">
  <canvas id="hero-canvas"></canvas>
  <div class="hero-noise"></div>
  <div class="hero-content">
    <div class="hero-eyebrow"><span data-i18n="hero.badge"></span></div>
    <h1 data-i18n-html="hero.title"></h1>
    <p class="hero-sub" data-i18n-html="hero.subtitle"></p>
    <a href="#product" class="hero-cta">
      <span data-i18n="hero.cta"></span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </a>
  </div>
  <div class="hero-scroll"><span>Scroll</span></div>
</section>

<!-- Product -->
<section class="product" id="product">
  <div class="section-inner">
    <div class="product-text reveal">
      <div class="section-label" data-i18n="product.label"></div>
      <h2 class="section-title" data-i18n-html="product.title"></h2>
      <p class="section-desc" data-i18n="product.desc"></p>
      <div class="product-features">
        <div class="product-feature">
          <h4 data-i18n="product.walk.title"></h4>
          <p data-i18n="product.walk.desc"></p>
        </div>
        <div class="product-feature">
          <h4 data-i18n="product.see.title"></h4>
          <p data-i18n="product.see.desc"></p>
        </div>
        <div class="product-feature">
          <h4 data-i18n="product.act.title"></h4>
          <p data-i18n="product.act.desc"></p>
        </div>
        <div class="product-feature">
          <h4 data-i18n="product.experience.title"></h4>
          <p data-i18n="product.experience.desc"></p>
        </div>
      </div>
    </div>
    <div class="product-visual reveal">
      <span class="product-visual-label" data-i18n="product.visual"></span>
    </div>
  </div>
</section>

<!-- Vision -->
<section class="vision" id="vision">
  <div class="section-inner">
    <div class="vision-visual reveal">
      <div class="dna-helix">
        <div class="dna-strand"></div>
        <div class="dna-strand"></div>
        <div class="dna-strand"></div>
        <div class="dna-strand"></div>
        <div class="dna-strand"></div>
        <div class="dna-pulse"></div>
        <div class="dna-dots">
          <div class="dna-dot"></div>
          <div class="dna-dot"></div>
          <div class="dna-dot"></div>
          <div class="dna-dot"></div>
          <div class="dna-dot"></div>
          <div class="dna-dot"></div>
        </div>
      </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ── Three.js Hero Particles — Dragon Rider (contour-line style) ──
  const canvas = document.getElementById('hero-canvas');
  if (canvas) {
    const isMobile = window.innerWidth <= 768;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: !isMobile });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.z = isMobile ? 38 : 30;

    // Continuous contour paths — particles sample along these lines
    // Each sub-array is a stroke; interpolation between sequential points
    const paths = [
      // Dragon outer contour (one continuous stroke: snout → head → neck → back → tail tip)
      [[9.8,2.6],[9.5,3.1],[9,3.3],[8.5,3.1],[8,2.8],[7.5,3],[7,3.3],[6.5,3.5],[6,3.6],[5.5,3.5],[5,3.6],[4.5,3.9],[4,4.1],[3.5,4.3],[3,4.4],[2.5,4.3],[2,4.2],[1.5,4.1],[1,4],[0.5,3.9],[0,3.8],[-0.5,3.7],[-1,3.6],[-1.5,3.5],[-2,3.4],[-2.5,3.2],[-3,3],[-3.5,2.7],[-4,2.4],[-4.5,2.1],[-5,1.8],[-5.5,1.5],[-6,1.2],[-6.5,0.9],[-7,0.6],[-7.5,0.3],[-8,0],[-8.5,-0.3]],
      // Dragon jaw line (snout → under jaw → throat → belly → hind)
      [[9.8,2.3],[9.5,2],[9,1.8],[8.5,1.7],[8,1.8],[7.5,1.6],[7,1.7],[6.5,1.9],[6,2.1],[5.5,2],[5,1.6],[4.5,1.2],[4,0.9],[3.5,0.7],[3,0.5],[2.5,0.4],[2,0.4],[1.5,0.5],[1,0.6],[0.5,0.8],[0,1],[-0.5,1.3]],
      // Hind leg right
      [[1.8,0.4],[2,0],[2.2,-0.6],[2.3,-1.3],[2.1,-2],[1.9,-2.7],[1.6,-3.3],[1.3,-3.8],[1.2,-4.2],[1.5,-4.5],[2,-4.5],[2.3,-4.2]],
      // Hind leg left
      [[-0.2,0.6],[-0.4,0],[-0.6,-0.6],[-0.7,-1.3],[-0.5,-2],[-0.3,-2.7],[-0.1,-3.3],[0.1,-3.8],[0.2,-4.2],[-0.1,-4.5],[0.4,-4.5],[0.7,-4.2]],
      // Small forearms
      [[5.2,1.8],[5.4,1.2],[5.5,0.6],[5.3,0.3]],
      [[4.8,1.6],[5,1],[5.1,0.5],[4.9,0.2]],
      // Spine ridge spikes
      [[4.5,4],[4.3,4.5],[4.5,3.9]],
      [[3.8,4.2],[3.6,4.7],[3.8,4.1]],
      [[3,4.4],[2.8,4.9],[3,4.3]],
      [[0.5,4],[0.3,4.4],[0.5,3.9]],
      [[-.2,3.8],[-.4,4.2],[-.2,3.7]],
      // ── Rider ──
      // Rider body (seated, leaning forward)
      [[1,3.6],[1.2,4.2],[1.4,4.8],[1.6,5.3],[1.7,5.8],[1.7,6.2],[1.6,6.6]],
      // Rider head
      [[1.4,6.6],[1.3,6.9],[1.5,7.1],[1.8,7],[1.7,6.7]],
      // Rider arm reaching forward
      [[1.8,5.8],[2.3,5.5],[2.8,5.2],[3.3,4.9],[3.8,4.7],[4.2,4.5]],
      // Rider other arm
      [[1.5,5.6],[1.9,5.3],[2.3,5],[2.7,4.8]],
      // Rider right leg
      [[2,4.2],[2.2,3.8],[2.3,3.4],[2.2,3.2]],
      // Rider left leg
      [[0.8,4.2],[0.6,3.8],[0.5,3.4],[0.6,3.2]],
      // Eye (small bright dot cluster — handled by a single point)
      [[8.9,2.9]],
    ];

    // Sample points along paths with interpolation
    function samplePaths(paths, totalPoints) {
      const out = [];
      // Measure total path length
      let totalLen = 0;
      const pathLens = [];
      for (const p of paths) {
        let len = 0;
        for (let i = 1; i < p.length; i++) {
          const dx = p[i][0] - p[i-1][0], dy = p[i][1] - p[i-1][1];
          len += Math.sqrt(dx*dx + dy*dy);
        }
        pathLens.push(Math.max(len, 0.01));
        totalLen += Math.max(len, 0.01);
      }
      // Distribute points proportional to path length
      for (let pi = 0; pi < paths.length; pi++) {
        const p = paths[pi];
        const n = Math.max(Math.round(totalPoints * pathLens[pi] / totalLen), 2);
        if (p.length === 1) {
          // single-point path (eye)
          for (let k = 0; k < 12; k++) out.push([p[0][0], p[0][1]]);
          continue;
        }
        // Build cumulative distances
        const segs = [0];
        for (let i = 1; i < p.length; i++) {
          const dx = p[i][0] - p[i-1][0], dy = p[i][1] - p[i-1][1];
          segs.push(segs[i-1] + Math.sqrt(dx*dx + dy*dy));
        }
        const pLen = segs[segs.length - 1];
        for (let i = 0; i < n; i++) {
          const d = (i / (n - 1)) * pLen;
          let si = 0;
          while (si < segs.length - 2 && segs[si+1] < d) si++;
          const segLen = segs[si+1] - segs[si];
          const t = segLen > 0 ? (d - segs[si]) / segLen : 0;
          out.push([
            p[si][0] + (p[si+1][0] - p[si][0]) * t,
            p[si][1] + (p[si+1][1] - p[si][1]) * t,
          ]);
        }
      }
      return out;
    }

    const PARTICLE_COUNT = isMobile ? 3000 : 6000;
    const sampled = samplePaths(paths, PARTICLE_COUNT);

    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const targets = new Float32Array(PARTICLE_COUNT * 3);
    const alphas = new Float32Array(PARTICLE_COUNT);
    const sizes = new Float32Array(PARTICLE_COUNT);

    const S = 1.5;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      // scattered start
      positions[i3]     = (Math.random() - 0.5) * 60;
      positions[i3 + 1] = (Math.random() - 0.5) * 50;
      positions[i3 + 2] = (Math.random() - 0.5) * 12;

      const sp = sampled[i % sampled.length];
      const jitter = 0.25;
      targets[i3]     = sp[0] * S + (Math.random() - 0.5) * jitter;
      targets[i3 + 1] = sp[1] * S + (Math.random() - 0.5) * jitter;
      targets[i3 + 2] = (Math.random() - 0.5) * 1.5;

      alphas[i] = 0.4 + Math.random() * 0.6;
      sizes[i] = Math.random() * 0.9 + 0.2;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));
    geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        attribute float size;
        attribute float aAlpha;
        varying float vAlpha;
        void main() {
          vAlpha = aAlpha;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * (160.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying float vAlpha;
        void main() {
          float d = length(gl_PointCoord - vec2(0.5));
          if (d > 0.5) discard;
          float glow = smoothstep(0.5, 0.0, d);
          float core = smoothstep(0.3, 0.0, d);
          float alpha = glow * vAlpha * 0.5;
          vec3 col = mix(vec3(0.35, 0.45, 0.0), vec3(0.784, 1.0, 0.0), core);
          gl_FragColor = vec4(col, alpha);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });

    const particles = new THREE.Points(geo, mat);
    particles.position.set(isMobile ? 1 : 6, isMobile ? 4 : -2, 0);
    scene.add(particles);

    let assembled = false;
    let assembleStart = 0;
    const ASSEMBLE_DURATION = 3.0;
    const SCATTER_DURATION = 1.0;
    let mouseX = 0, mouseY = 0;

    window.addEventListener('mousemove', e => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    function resize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      const mobile = w <= 768;
      camera.position.z = mobile ? 38 : 30;
      particles.position.set(mobile ? 1 : 6, mobile ? 4 : -2, 0);
      camera.updateProjectionMatrix();
    }
    resize();
    window.addEventListener('resize', resize);

    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.016;
      mat.uniforms.uTime.value = time;

      const pos = geo.attributes.position.array;
      let t;
      if (!assembled) {
        t = Math.min(time / SCATTER_DURATION, 1);
        if (t >= 1) { assembled = true; assembleStart = time; }
      }
      if (assembled) {
        t = Math.min((time - assembleStart) / ASSEMBLE_DURATION, 1);
      }

      const eased = assembled ? easeOutCubic(t) : 1 - easeOutCubic(t);
      const speed = 0.03;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        const tx = targets[i3], ty = targets[i3+1], tz = targets[i3+2];

        if (assembled) {
          const breath = Math.sin(time * 1.0 + tx * 0.15) * 0.08;
          pos[i3]     += (tx - pos[i3]) * speed * eased + Math.sin(time * 0.6 + i * 0.3) * 0.002;
          pos[i3 + 1] += (ty + breath - pos[i3 + 1]) * speed * eased + Math.cos(time * 0.4 + i * 0.2) * 0.002;
          pos[i3 + 2] += (tz - pos[i3 + 2]) * speed * eased;
        } else {
          pos[i3]     += Math.sin(time + i * 0.01) * 0.012;
          pos[i3 + 1] += Math.cos(time * 0.7 + i * 0.01) * 0.012;
          pos[i3 + 2] += Math.sin(time * 0.5 + i * 0.02) * 0.006;
        }
      }
      geo.attributes.position.needsUpdate = true;

      particles.rotation.y = mouseX * 0.05 + Math.sin(time * 0.12) * 0.02;
      particles.rotation.x = -mouseY * 0.025;

      renderer.render(scene, camera);
    }

    function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
    animate();
  }

  let currentLang = 'en';

  function setLang(lang) {
    currentLang = lang;
    const dict = i18n[lang];
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (dict[key]) el.textContent = dict[key];
    });
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const key = el.getAttribute('data-i18n-html');
      if (dict[key]) el.innerHTML = dict[key];
    });

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });

    const titleMap = { en: 'Xrange — Intelligence, Embodied', zh: 'Xrange — 让智能具身而行' };
    document.title = titleMap[lang];
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLang(btn.dataset.lang));
  });

  const nav = document.getElementById('nav');
  const toggle = document.getElementById('navToggle');
  const links = document.getElementById('navLinks');

  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 20);
  });

  toggle.addEventListener('click', () => links.classList.toggle('open'));
  links.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => links.classList.remove('open'));
  });

  const observer = new IntersectionObserver(
    entries => entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        observer.unobserve(e.target);
      }
    }),
    { threshold: 0.12, rootMargin: '0px 0px -60px 0px' }
  );
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

  setLang('en');
})();
